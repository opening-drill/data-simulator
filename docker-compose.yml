services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FLASK_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FLIGHT_INTERVAL_SECONDS: ${FLIGHT_INTERVAL_SECONDS:-3}
      API_BASE_URL: ${API_BASE_URL}
      API_KEY: ${API_KEY}
      POLYGON_INTERVAL_SECONDS: ${POLYGON_INTERVAL_SECONDS:-30}
      POLYGON_EXPIRY_MINUTES: ${POLYGON_EXPIRY_MINUTES:-3}
      TOTAL_MIN_LON: ${TOTAL_MIN_LON:-33.50}
      TOTAL_MAX_LON: ${TOTAL_MAX_LON:-35.90}
      TOTAL_MIN_LAT: ${TOTAL_MIN_LAT:-29.45}
      TOTAL_MAX_LAT: ${TOTAL_MAX_LAT:-33.30}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
